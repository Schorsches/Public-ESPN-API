  :root { color-scheme: light dark; }
  body { font: 14px system-ui, sans-serif; margin: 2rem; }
  h1 { font-size: 1.1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 1rem; }
  figure { margin: 0; text-align: center; }
  figcaption { margin-top: .4rem; opacity: .7; font-variant-numeric: tabular-nums; }
  .swatch { padding: 1rem; border-radius: 8px; }
  .on-dark { background: #111; color: #eee; }
</style></head><body>
